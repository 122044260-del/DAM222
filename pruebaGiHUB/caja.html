<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Coffe Shop | Caja</title>
    <link rel="stylesheet" href="src/css/styles.css">
</head>
<body>

    <header class="barra">
        <h1>Coffe Shop - Caja</h1>
        <nav class="navegacion">
            <a href="index.html">Cliente</a>
            <a href="caja.html" class="activo">Caja</a>
            <a href="cocina.html">Cocina</a>
        </nav>
    </header>

    <main class="contenedor">
        <section class="panel-modulo">
            <h2>Cuentas y Cobro</h2>
            <p>Resumen de pedidos y total a cobrar por comanda</p>
            <div id="caja-pedidos"></div>
        </sectio >
    </main>

    <script>
    // Guarda los pedidos en el navegador
    function getOrders() {
        var datos = localStorage.getItem('coffeeshop-orders');
        if (datos == null) {
            return [];
        }
        return JSON.parse(datos);
    }

    function saveOrders(lista) {
        localStorage.setItem('coffeeshop-orders', JSON.stringify(lista));
    }

    // Da formato al precio
    function formatPrice(precio) {
        return '$' + precio + ' MXN';
    }

    // Suma todos los precios de un pedido
    function calculateTotal(productos) {
        var total = 0;
        var i;

        for (i = 0; i < productos.length; i++) {
            if (productos[i].finalPrice != undefined) {
                total = total + productos[i].finalPrice;
            } else {
                total = total + productos[i].price;
            }
        }

        return total;
    }

    // Devuelve 
    function mensajeEstado(estado) {
        if (estado == 'pendiente') {
            return 'Tu pedido fue recibido';
        } else if (estado == 'preparando') {
            return 'Tu pedido se esta preparando';
        } else if (estado == 'cocinando') {
            return 'Tu pedido se esta cocinando';
        } else if (estado == 'listo') {
            return 'Tu pedido esta listo';
        } else if (estado == 'entregado') {
            return 'Tu pedido fue entregado';
        } else if (estado == 'cancelado') {
            return 'Tu pedido fue cancelado';
        } else if (estado == 'faltaProducto') {
            return 'Falta un producto de tu pedido';
        } else {
            return estado;
        }
    }

    //  no se puede cambiar
    function estaCerrado(estado) {
        if (estado == 'entregado') {
            return true;
        }
        if (estado == 'cancelado') {
            return true;
        }
        return false;
    }

    // Dibuja todos los pedidos 
    function renderOrders() {
        var contenedor = document.getElementById('caja-pedidos');
        var pedidos = getOrders();
        var i;
        var j;
        var pedido;
        var producto;
        var html;
        var total;

        contenedor.innerHTML = '';

        if (pedidos.length == 0) {
            contenedor.innerHTML = '<p>No hay pedidos registrados.</p>';
            return;
        }

        for (i = 0; i < pedidos.length; i++) {
            pedido = pedidos[i];
            total = calculateTotal(pedido.productos);

            // Lista de productos
            html = '';
            for (j = 0; j < pedido.productos.length; j++) {
                producto = pedido.productos[j];

                if (producto.finalPrice != undefined) {
                    html = html + '<li>' + producto.name + ' - ' +
                        formatPrice(producto.finalPrice) + '</li>';
                } else {
                    html = html + '<li>' + producto.name + ' - ' +
                        formatPrice(producto.price) + '</li>';
                }
            }

            var tarjeta = document.createElement('article');
            tarjeta.className = 'pedido-caja';

            tarjeta.innerHTML =
                '<h3>Pedido #' + pedido.id + '</h3>' +
                '<p>Estado: ' + pedido.estado + '</p>' +
                '<p>' + mensajeEstado(pedido.estado) + '</p>' +
                '<ul>' + html + '</ul>' +
                '<p>Total: ' + formatPrice(total) + '</p>' +
                '<button class="btn-cobrar" data-id="' + pedido.id + '">Cobrar</button>' +
                '<button class="btn-falta" data-id="' + pedido.id + '">Falta producto</button>' +
                '<button class="btn-cancelar" data-id="' + pedido.id + '">Cancelar</button>';

            contenedor.appendChild(tarjeta);
        }

        activarBotones();
    }

    // Cambia el estado de un pedido
    function cambiarEstado(id, nuevoEstado) {
        var pedidos = getOrders();
        var i;
        var pedido = null;

        for (i = 0; i < pedidos.length; i++) {
            if (pedidos[i].id == id) {
                pedido = pedidos[i];
            }
        }

        if (pedido == null) {
            return;
        }

        // Si ya termino, no se cambia
        if (estaCerrado(pedido.estado)) {
            return;
        }

        pedido.estado = nuevoEstado;
        saveOrders(pedidos);
        renderOrders();
    }

    //  tres botones
    function activarBotones() {
        var botonesCobrar = document.querySelectorAll('.btn-cobrar');
        var botonesFalta = document.querySelectorAll('.btn-falta');
        var botonesCancelar = document.querySelectorAll('.btn-cancelar');
        var i;

        for (i = 0; i < botonesCobrar.length; i++) {
            botonesCobrar[i].onclick = function () {
                cambiarEstado(Number(this.dataset.id), 'entregado');
            };
        }

        for (i = 0; i < botonesFalta.length; i++) {
            botonesFalta[i].onclick = function () {
                cambiarEstado(Number(this.dataset.id), 'faltaProducto');
            };
        }

        for (i = 0; i < botonesCancelar.length; i++) {
            botonesCancelar[i].onclick = function () {
                cambiarEstado(Number(this.dataset.id), 'cancelado');
            };
        }
    }

    // Simula el pedido
    function simularPedido(id) {
        setTimeout(function () {
            cambiarEstado(id, 'preparando');
        }, 3000);

        setTimeout(function () {
            cambiarEstado(id, 'cocinando');
        }, 6000);

        setTimeout(function () {
            cambiarEstado(id, 'listo');
        }, 9000);

        setTimeout(function () {
            cambiarEstado(id, 'entregado');
        }, 12000);
    }

    // pagina
    document.addEventListener('DOMContentLoaded', function () {
        renderOrders();
    });

    window.simularPedido = simularPedido;
    </script>

</body>
</html>
